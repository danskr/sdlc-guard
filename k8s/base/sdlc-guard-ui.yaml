apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdlc-guard-ui
  namespace: sdlc-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdlc-guard-ui
  template:
    metadata:
      labels:
        app: sdlc-guard-ui
    spec:
      containers:
        - name: sdlc-guard-ui
          image: sdlc-guard-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sdlc-guard-ui
  namespace: sdlc-guard
spec:
  selector:
    app: sdlc-guard-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
